services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: tax_research
      POSTGRES_PASSWORD: tax_research
      POSTGRES_DB: tax_research
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tax_research"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    profiles: ["tools"]
    depends_on:
      - postgres
      - ollama

  ingestion:
    build: services/ingestion
    profiles: ["tools"]
    depends_on:
      - postgres

volumes:
  postgres_data:
  ollama_data:
