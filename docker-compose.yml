services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: tax_research
      POSTGRES_PASSWORD: tax_research
      POSTGRES_DB: tax_research
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tax_research"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
