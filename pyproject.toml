[project]
name = "tax-research-copilot"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Pablo Felipe", email = "pablofelipe@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-postgres>=3.1.2",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "pgvector>=0.5.0",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2.9",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
markers = [
    "integration: requires the docker-compose postgres service to be running",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""
