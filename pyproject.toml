[project]
name = "tax-research-copilot"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Pablo Felipe", email = "pablofelipe@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-postgres>=3.1.2",
    "pydantic>=2.9",
]

[dependency-groups]
